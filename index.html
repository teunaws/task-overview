<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task Overview</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111111">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #16181d;
    --muted: #6b7280;
    --line: #e4e6eb;
    --badge-bg: #eef1f6;
    --link: #1a56db;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --fg: #e8eaed;
      --muted: #9aa1ab;
      --line: #2a2e35;
      --badge-bg: #24282f;
      --link: #7aa7ff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px;
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .checked { color: var(--muted); font-size: 13px; margin: 0 0 14px; }
  .wrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; min-width: 420px; }
  th, td {
    text-align: left; padding: 9px 10px;
    border-bottom: 1px solid var(--line); vertical-align: top;
  }
  th {
    font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted); font-weight: 600; white-space: nowrap;
  }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .name { font-weight: 500; }
  .pay, .num, .created { white-space: nowrap; }
  .num, .created { color: var(--muted); }
  .badges { margin-top: 5px; display: flex; flex-wrap: wrap; gap: 4px; }
  .badge {
    display: inline-block; padding: 2px 7px; border-radius: 999px;
    background: var(--badge-bg); color: var(--muted);
    font-size: 11px; font-weight: 500; white-space: nowrap;
  }
  .empty { color: var(--muted); text-align: center; padding: 28px 10px; }
  .error { color: #b42318; text-align: center; padding: 28px 10px; }
  @media (prefers-color-scheme: dark) { .error { color: #ff9b8f; } }
</style>
</head>
<body>
  <h1>Task Overview</h1>
  <p class="checked" id="checked">Loading&hellip;</p>
  <div class="wrap">
    <table>
      <thead>
        <tr><th>Name</th><th>Pay</th><th>Tasks</th><th>Created</th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
<script>
(function () {
  var rows = document.getElementById('rows');
  var checked = document.getElementById('checked');

  function messageRow(text, className) {
    var tr = document.createElement('tr');
    var td = document.createElement('td');
    td.colSpan = 4;
    td.className = className;
    td.textContent = text;
    tr.appendChild(td);
    rows.appendChild(tr);
  }

  function cell(tr, text, className) {
    var td = document.createElement('td');
    td.className = className;
    td.textContent = text == null ? '' : String(text);
    tr.appendChild(td);
    return td;
  }

  function render(data) {
    var tasks = (data && data.tasks) || [];
    rows.textContent = '';

    checked.textContent = 'Last checked ' + ((data && data.checked_at) || 'unknown') +
      ' \u00b7 ' + tasks.length + ' listed';

    if (!tasks.length) {
      messageRow('No tasks currently listed.', 'empty');
      return;
    }

    tasks.forEach(function (task) {
      var tr = document.createElement('tr');

      var nameCell = cell(tr, '', 'name');
      var link = document.createElement('a');
      link.href = task.url || '#';
      link.textContent = task.name || '(unnamed project)';
      nameCell.appendChild(link);

      var badges = task.badges || [];
      if (badges.length) {
        var wrap = document.createElement('div');
        wrap.className = 'badges';
        badges.forEach(function (badge) {
          if (!badge || !badge.label) { return; }
          var pill = document.createElement('span');
          pill.className = 'badge';
          pill.textContent = badge.label;
          wrap.appendChild(pill);
        });
        nameCell.appendChild(wrap);
      }

      cell(tr, task.pay, 'pay');
      cell(tr, task.tasks, 'num');
      cell(tr, task.created, 'created');
      rows.appendChild(tr);
    });
  }

  function fail() {
    rows.textContent = '';
    checked.textContent = '';
    messageRow('Couldn\u2019t load the latest data \u2014 try refreshing.', 'error');
  }

  // Query string defeats the Pages CDN (a new URL every load); no-store
  // defeats the browser's own cache. Both, deliberately.
  fetch('tasks.json?t=' + Date.now(), { cache: 'no-store' })
    .then(function (r) {
      if (!r.ok) { throw new Error('HTTP ' + r.status); }
      return r.json();
    })
    .then(render)
    .catch(fail);
})();
</script>
</body>
</html>
